<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Henry Radoff</title>
<meta name="description" content="Photo gallery for author Henry Radoff — Breaking Free and other books.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum-950:#1A1420;
    --plum-900:#2A1E36;
    --plum-800:#3A2842;
    --plum-700:#4A3050;
    --plum-600:#5A3A5E;
    --violet-glow:#7A4F84;
    --noir:#1C160F;
    --bronze-950:#221A10;
    --bronze-900:#2E2313;
    --ivory:#0A0A0A;
    --ivory-dim:#111111;
    --gold:#D4AF5E;
    --gold-bright:#F0D28C;
    --gold-soft:#EEDFB4;
    --gold-dim:#C9A054;
    --wine:#6E2A3B;
    --wine-soft:#C79AA6;
    --ink:#EDE8DE;
    --ink-soft:#B9B2A6;
    --paper-line:rgba(255,255,255,0.12);
    --shadow-plum: 0 40px 90px -35px rgba(22,19,32,0.55);
    --shadow-soft: 0 18px 40px -20px rgba(22,19,32,0.25);
    --ease: cubic-bezier(.22,.68,.36,1);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  html, body{ cursor:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMicgaGVpZ2h0PScyMicgdmlld0JveD0nMCAwIDIyIDIyJz4KICA8Y2lyY2xlIGN4PScxMScgY3k9JzExJyByPSc4JyBmaWxsPSdub25lJyBzdHJva2U9JyNENEFGNUUnIHN0cm9rZS13aWR0aD0nMS4xJyBvcGFjaXR5PScwLjUnLz4KICA8Y2lyY2xlIGN4PScxMScgY3k9JzExJyByPSczLjQnIGZpbGw9JyNENEFGNUUnLz4KICA8Y2lyY2xlIGN4PScxMScgY3k9JzExJyByPScxLjInIGZpbGw9JyMyQTFFMzYnLz4KPC9zdmc+Cg==") 11 11, auto; }
  a, button, .nav-toggle, .tile{ cursor:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyNCcgaGVpZ2h0PScyNCcgdmlld0JveD0nMCAwIDI0IDI0Jz4KICA8cGF0aCBkPSdNMTIgMS41IEwyMSAxMiBMMTIgMjIuNSBMMyAxMiBaJyBmaWxsPScjRjBEMjhDJyBzdHJva2U9JyMyQTFFMzYnIHN0cm9rZS13aWR0aD0nMS4yJy8+CiAgPHBhdGggZD0nTTEyIDYgTDE3IDEyIEwxMiAxOCBMNyAxMiBaJyBmaWxsPSdub25lJyBzdHJva2U9JyMyQTFFMzYnIHN0cm9rZS13aWR0aD0nMC44JyBvcGFjaXR5PScwLjYnLz4KICA8Y2lyY2xlIGN4PScxMicgY3k9JzEyJyByPScxLjYnIGZpbGw9JyMyQTFFMzYnLz4KPC9zdmc+Cg==") 12 12, pointer; }
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:"Karla", -apple-system, sans-serif;
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  h1,h2,h3{ font-family:"Spectral", Georgia, serif; font-weight:600; margin:0; color:var(--gold-soft); }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
  @media (max-width:640px){ .wrap{ padding:0 22px; } }

  /* ---- header (shared) ---- */
  .site-header{ position:sticky; top:0; z-index:100; background:rgba(22,19,32,.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(212,175,94,.18); }
  .nav-inner{ max-width:1180px; margin:0 auto; padding:18px 32px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-family:"Spectral",serif; font-size:1.25rem; color:var(--ink); font-weight:600; letter-spacing:.02em; }
  .logo em{ color:var(--gold); font-style:normal; }
  .nav-links{ display:flex; gap:34px; }
  .nav-links a{ color:rgba(250,248,245,.82); font-size:.92rem; font-weight:500; position:relative; padding-bottom:4px; transition:color .25s ease; }
  .nav-links a::after{ content:""; position:absolute; left:0; right:100%; bottom:0; height:1px; background:var(--gold); transition:right .3s var(--ease); }
  .nav-links a:hover{ color:var(--ink); }
  .nav-links a:hover::after{ right:0; }
  .nav-links a.active{ color:var(--gold); }
  .nav-toggle{ display:none; background:none; border:none; color:var(--ink); font-size:1.4rem; cursor:pointer; }
  @media (max-width:820px){
    .nav-links{ position:absolute; top:100%; left:0; right:0; flex-direction:column; gap:0; background:var(--noir); max-height:0; overflow:hidden; transition:max-height .4s var(--ease); border-bottom:1px solid rgba(212,175,94,.18); }
    .nav-links.open{ max-height:320px; }
    .nav-links a{ padding:16px 32px; border-top:1px solid rgba(255,255,255,.06); }
    .nav-toggle{ display:block; }
  }

  /* ---- banner ---- */
  .banner{
    background:
      radial-gradient(65% 70% at 88% 6%, rgba(240,210,140,.18), transparent 60%),
      radial-gradient(55% 55% at 12% 18%, rgba(122,79,132,.18), transparent 62%),
      radial-gradient(120% 140% at 50% 0%, var(--bronze-900) 0%, var(--noir) 65%);
    color:var(--ink);
    padding:90px 0 74px;
    text-align:center;
  }
  .banner .tag{ font-family:"Spectral",serif; font-style:italic; color:var(--gold-soft); display:block; margin-bottom:12px; }
  .banner h1{ color:var(--ink); font-size:clamp(2.4rem,5vw,3.4rem); }
  .banner p{ margin-top:16px; color:rgba(250,248,245,.75); max-width:480px; margin-left:auto; margin-right:auto; }

  /* ---- grid ---- */
  .gallery-wrap{ padding:80px 0 120px; }
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
  }
  @media (max-width:960px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:560px){ .grid{ grid-template-columns:repeat(2,1fr); gap:10px; } }

  .tile{
    position:relative;
    aspect-ratio:1;
    overflow:hidden;
    cursor:pointer;
    background:linear-gradient(155deg,var(--bronze-900),var(--noir));
    border:1px solid transparent;
    transition:border-color .3s ease, transform .4s var(--ease);
  }
  .tile:hover{ transform:translateY(-4px); border-color:var(--gold); }
  .tile img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .4s ease;
  }
  .tile img.loaded{ opacity:1; }

  /* ---- lightbox ---- */
  .lightbox{
    position:fixed; inset:0; z-index:1000;
    background:rgba(36,18,38,.94);
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    transition:opacity .35s ease, visibility .35s ease;
    padding:24px;
  }
  .lightbox.open{ opacity:1; visibility:visible; }
  .lightbox-inner{
    position:relative;
    max-width:92vw;
    max-height:88vh;
    display:flex; align-items:center; justify-content:center;
  }
  .lightbox-inner img{
    display:block;
    max-width:92vw;
    max-height:88vh;
    width:auto; height:auto;
    object-fit:contain;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
  }
  .lightbox-close, .lightbox-prev, .lightbox-next{
    position:fixed;
    background:rgba(22,19,32,.9);
    border:1px solid rgba(212,175,94,.6);
    color:var(--gold-soft);
    width:48px; height:48px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:1.2rem;
    z-index:1001;
    transition:background .25s ease, color .25s ease;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover{ background:var(--gold); color:var(--plum-900); }
  .lightbox-close{ top:20px; right:20px; }
  .lightbox-prev{ left:20px; top:50%; transform:translateY(-50%); }
  .lightbox-next{ right:20px; top:50%; transform:translateY(-50%); }
  @media (max-width:760px){
    .lightbox{ padding:14px; }
    .lightbox-close{ top:14px; right:14px; width:42px; height:42px; }
    .lightbox-prev{ left:10px; width:42px; height:42px; }
    .lightbox-next{ right:10px; width:42px; height:42px; }
  }

  /* ---- footer ---- */
  .site-footer{ background:var(--noir); color:rgba(251,249,244,.55); padding:44px 0; text-align:center; font-size:.8rem; letter-spacing:.02em; border-top:1px solid rgba(203,166,83,.14); }
  .site-footer a{ color:var(--gold-soft); }
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <a href="index.html" class="logo">Henry <em>Radoff</em></a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html#story">Home</a>
      <a href="about.html">About</a>
      <a href="trailer.html">Trailer</a>
      <a href="books.html">Books</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<section class="banner">
  <div class="wrap">
    <span class="tag">Photo Gallery</span>
    <h1>Moments Along the Way</h1>
    <p>A collection of photographs from Henry Radoff's life, research, and books. Click any photo to view it larger.</p>
  </div>
</section>

<section class="gallery-wrap">
  <div class="wrap">
    <div class="grid" id="galleryGrid"></div>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&#10005;</button>
  <button class="lightbox-prev" id="lbPrev" aria-label="Previous">&#8592;</button>
  <button class="lightbox-next" id="lbNext" aria-label="Next">&#8594;</button>
  <div class="lightbox-inner">
    <img id="lbImg" src="" alt="">
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    &copy; <span id="year"></span> Henry Radoff </a>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var navToggle = document.getElementById('navToggle');
  var navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', function(){ navLinks.classList.toggle('open'); });

  /* Build 25 tiles. Each looks for images/1.jpg ... images/25.jpg —
     drop real photos into the images folder (same file names) and
     they'll replace these placeholders automatically. */
  var TOTAL = 20;
  var grid = document.getElementById('galleryGrid');

  for(var i=1;i<=TOTAL;i++){
    var num = (i<10 ? '0'+i : ''+i);
    var tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.index = i-1;
    tile.dataset.num = num;
    tile.dataset.file = i;
    tile.innerHTML =
      '<img src="images/'+i+'.jpg" alt="Photo '+num+'" ' +
      'onload="this.classList.add(\'loaded\')" ' +
      'onerror="this.closest(\'.tile\').style.display=\'none\'">';
    grid.appendChild(tile);
  }

  var tiles = Array.prototype.slice.call(grid.querySelectorAll('.tile'));
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var current = 0;

  function openLB(idx){
    current = idx;
    var file = tiles[idx].dataset.file;
    lbImg.src = 'images/'+file+'.jpg';
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLB(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }
  function nav(dir){ openLB((current + dir + tiles.length) % tiles.length); }

  tiles.forEach(function(tile, idx){
    tile.addEventListener('click', function(){ openLB(idx); });
  });
  document.getElementById('lbClose').addEventListener('click', closeLB);
  document.getElementById('lbPrev').addEventListener('click', function(){ nav(-1); });
  document.getElementById('lbNext').addEventListener('click', function(){ nav(1); });
  lightbox.addEventListener('click', function(e){ if(e.target === lightbox){ closeLB(); } });
  document.addEventListener('keydown', function(e){
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLB();
    if(e.key === 'ArrowLeft') nav(-1);
    if(e.key === 'ArrowRight') nav(1);
  });
</script>

</body>
</html>
