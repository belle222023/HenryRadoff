<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch the Trailer — Breaking Free by Henry Radoff</title>
<meta name="description" content="Watch the official book trailer for Breaking Free, a Holocaust novel of courage, faith, and the will to live by Henry Radoff.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum-950:#1A1420;
    --plum-900:#2A1E36;
    --plum-800:#3A2842;
    --plum-700:#4A3050;
    --plum-600:#5A3A5E;
    --violet-glow:#7A4F84;
    --noir:#1C160F;
    --bronze-950:#221A10;
    --bronze-900:#2E2313;
    --ivory:#0A0A0A;
    --ivory-dim:#111111;
    --gold:#D4AF5E;
    --gold-bright:#F0D28C;
    --gold-soft:#EEDFB4;
    --gold-dim:#C9A054;
    --wine:#6E2A3B;
    --wine-soft:#C79AA6;
    --ink:#EDE8DE;
    --ink-soft:#B9B2A6;
    --paper-line:rgba(255,255,255,0.12);
    --shadow-plum: 0 40px 90px -35px rgba(22,19,32,0.55);
    --shadow-soft: 0 18px 40px -20px rgba(22,19,32,0.25);
    --ease: cubic-bezier(.22,.68,.36,1);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  html, body{ cursor:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMicgaGVpZ2h0PScyMicgdmlld0JveD0nMCAwIDIyIDIyJz4KICA8Y2lyY2xlIGN4PScxMScgY3k9JzExJyByPSc4JyBmaWxsPSdub25lJyBzdHJva2U9JyNENEFGNUUnIHN0cm9rZS13aWR0aD0nMS4xJyBvcGFjaXR5PScwLjUnLz4KICA8Y2lyY2xlIGN4PScxMScgY3k9JzExJyByPSczLjQnIGZpbGw9JyNENEFGNUUnLz4KICA8Y2lyY2xlIGN4PScxMScgY3k9JzExJyByPScxLjInIGZpbGw9JyMyQTFFMzYnLz4KPC9zdmc+Cg==") 11 11, auto; }
  a, button, .btn, .nav-toggle{ cursor:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyNCcgaGVpZ2h0PScyNCcgdmlld0JveD0nMCAwIDI0IDI0Jz4KICA8cGF0aCBkPSdNMTIgMS41IEwyMSAxMiBMMTIgMjIuNSBMMyAxMiBaJyBmaWxsPScjRjBEMjhDJyBzdHJva2U9JyMyQTFFMzYnIHN0cm9rZS13aWR0aD0nMS4yJy8+CiAgPHBhdGggZD0nTTEyIDYgTDE3IDEyIEwxMiAxOCBMNyAxMiBaJyBmaWxsPSdub25lJyBzdHJva2U9JyMyQTFFMzYnIHN0cm9rZS13aWR0aD0nMC44JyBvcGFjaXR5PScwLjYnLz4KICA8Y2lyY2xlIGN4PScxMicgY3k9JzEyJyByPScxLjYnIGZpbGw9JyMyQTFFMzYnLz4KPC9zdmc+Cg==") 12 12, pointer; }
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:"Karla", -apple-system, sans-serif;
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  h1,h2,h3,h4{
    font-family:"Spectral", Georgia, serif;
    font-weight:600;
    margin:0;
    color:var(--gold-soft);
    letter-spacing:-0.01em;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
  @media (max-width:640px){ .wrap{ padding:0 22px; } }
  section{ position:relative; }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:.5em;
    padding:14px 30px;
    border-radius:2px;
    font-family:"Karla",sans-serif;
    font-weight:600;
    font-size:.95rem;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .35s var(--ease), box-shadow .35s var(--ease), background .3s ease, color .3s ease, border-color .3s ease;
  }
  .btn-gold{ background:linear-gradient(155deg, var(--gold-bright), var(--gold) 55%, var(--gold-dim)); color:var(--plum-950); }
  .btn-gold:hover{ transform:translateY(-2px); box-shadow:0 14px 30px -12px rgba(203,166,83,.6); }
  .btn-outline{ background:transparent; border-color:rgba(250,248,245,.45); color:var(--ink); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); transform:translateY(-2px); }
  .btn-plum{ background:var(--plum-900); color:var(--ink); }
  .btn-plum:hover{ background:var(--plum-700); transform:translateY(-2px); }

  .site-header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(22,19,32,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(212,175,94,.18);
  }
  .nav-inner{
    max-width:1180px;
    margin:0 auto;
    padding:18px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{ font-family:"Spectral",serif; font-size:1.25rem; color:var(--ink); font-weight:600; letter-spacing:.02em; }
  .logo em{ color:var(--gold); font-style:normal; }
  .nav-links{ display:flex; gap:34px; }
  .nav-links a{
    color:rgba(250,248,245,.82);
    font-size:.92rem;
    font-weight:500;
    position:relative;
    padding-bottom:4px;
    transition:color .25s ease;
  }
  .nav-links a::after{
    content:"";
    position:absolute; left:0; right:100%; bottom:0;
    height:1px; background:var(--gold);
    transition:right .3s var(--ease);
  }
  .nav-links a:hover{ color:var(--ink); }
  .nav-links a:hover::after{ right:0; }
  .nav-toggle{ display:none; background:none; border:none; color:var(--ink); font-size:1.4rem; cursor:pointer; }
  @media (max-width:820px){
    .nav-links{
      position:absolute; top:100%; left:0; right:0;
      flex-direction:column; gap:0;
      background:var(--noir);
      max-height:0; overflow:hidden;
      transition:max-height .4s var(--ease);
      border-bottom:1px solid rgba(212,175,94,.18);
    }
    .nav-links.open{ max-height:320px; }
    .nav-links a{ padding:16px 32px; border-top:1px solid rgba(255,255,255,.06); }
    .nav-toggle{ display:block; }
  }

  .section-head{ max-width:640px; margin:0 auto 56px; text-align:center; }
  .section-head .tag{ font-family:"Spectral",serif; font-style:italic; color:var(--gold-dim); display:block; margin-bottom:10px; font-size:1rem; }
  .section-head h2{ font-size:clamp(2rem,4vw,2.7rem); }
  .section-head p{ color:var(--ink-soft); margin-top:16px; }

  .reveal{ opacity:0; transform:translateY(26px); transition:opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in{ opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){ .reveal{ opacity:1; transform:none; transition:none; } }

  .page-banner{
    padding:90px 0 60px;
    background:
      radial-gradient(65% 70% at 88% 6%, rgba(240,210,140,.18), transparent 60%),
      radial-gradient(55% 55% at 12% 18%, rgba(122,79,132,.18), transparent 62%),
      radial-gradient(120% 140% at 50% 0%, var(--bronze-900) 0%, var(--noir) 65%);
    color:var(--ink);
    text-align:center;
  }
  .page-banner .hero-kicker{ font-family:"Spectral",serif; font-style:italic; color:var(--gold-soft); font-size:1.05rem; margin-bottom:16px; display:block; }
  .page-banner h1{ color:var(--ink); font-size:clamp(2.4rem,6vw,3.6rem); }

  .trailer{ padding:90px 0 120px; background:linear-gradient(165deg, var(--bronze-900), var(--noir)); color:var(--ink); }
  .trailer .section-head h2{ color:var(--ink); }
  .trailer .section-head p{ color:rgba(250,248,245,.72); }
  .trailer .section-head .tag{ color:var(--gold); }
  .video-frame{ max-width:920px; margin:0 auto; border:1px solid rgba(212,175,94,.35); padding:10px; background:rgba(0,0,0,.15); }
  .video-frame .ratio{ position:relative; width:100%; padding-top:56.25%; }
  .video-frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-cap{ text-align:center; margin-top:18px; font-size:.85rem; color:rgba(250,248,245,.6); }

  .more-books{ padding:100px 0; background:var(--ivory); text-align:center; }

  /* ============ FOOTER ============ */
  .site-footer{
    background:var(--noir);
    color:rgba(251,249,244,.55);
    padding:44px 0;
    text-align:center;
    font-size:.8rem;
    letter-spacing:.02em;
    border-top:1px solid rgba(203,166,83,.14);
  }
  .site-footer a{ color:var(--gold-soft); }
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <a href="index.html" class="logo">Henry <em>Radoff</em></a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html#story">Home</a>
      <a href="about.html">About</a>
      <a href="trailer.html">Trailer</a>
      <a href="books.html">Books</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
  </div>
</header>



<section class="trailer" id="trailer">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="tag">Watch</span>
      <h2>The Breaking Free trailer</h2>
      <p>A short look at the story behind the novel.</p>
    </div>
    <div class="video-frame reveal">
      <div class="ratio">
        <iframe src="https://drive.google.com/file/d/1CtZkqCYVE4OLVEsY9tcpkTPcv3mVuYgH/preview" allow="autoplay" allowfullscreen title="Breaking Free — Book Trailer"></iframe>
      </div>
    </div>
    <p class="video-cap">Breaking Free &mdash; Book Trailer</p>
  </div>
</section>


<footer class="site-footer">
  <div class="wrap">
    &copy; <span id="year"></span> Henry Radoff </a>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var navToggle = document.getElementById('navToggle');
  var navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', function(){
    navLinks.classList.toggle('open');
  });
  navLinks.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ navLinks.classList.remove('open'); });
  });

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var revealEls = document.querySelectorAll('.reveal');
  if(reduceMotion){
    revealEls.forEach(function(el){ el.classList.add('in'); });
  } else if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold:0.15, rootMargin:'0px 0px -60px 0px' });
    revealEls.forEach(function(el){ io.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('in'); });
  }
</script>

</body>
</html>
